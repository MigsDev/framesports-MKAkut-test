# Preserve the previous Compose project identity so existing named database volumes remain attached.
name: framesports-practice

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: framesports
      POSTGRES_PASSWORD: framesports_dev
      POSTGRES_DB: framesports_development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framesports -d framesports_development"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_USERNAME: framesports
      DB_PASSWORD: framesports_dev
      FRONTEND_ORIGIN: http://localhost:5173
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ruby_bundle:/usr/local/bundle
    command: >
      sh -c "
      rm -f tmp/pids/server.pid &&
      bundle install &&
      bin/rails db:prepare &&
      bin/rails server -b 0.0.0.0 -p 3000
      "
  web:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
volumes:
  pgdata:
  ruby_bundle:
  node_modules:
